<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LaundryScope — Panel de utilización</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/MarkerCluster.css" />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/MarkerCluster.Default.css" />

<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap');

  :root{
    --bg: #F5F6F8;
    --panel: #FFFFFF;
    --line: #E4E7EC;
    --ink: #171B21;
    --ink-soft: #5B6472;
    --ink-faint: #8A93A3;
    --brand: #1B4B66;
    --brand-soft: #E7EEF2;
    --accent: #2FB8C6;

    --c1: #E5484D; /* baja */
    --c2: #F0883E; /* media-baja */
    --c3: #F2C94C; /* media */
    --c4: #8BC77A; /* alta */
    --c5: #2E8B57; /* muy alta */

    --radius-card: 14px;
    --radius-pill: 999px;
    --shadow: 0 1px 2px rgba(23,27,33,.04), 0 8px 24px -12px rgba(23,27,33,.12);
  }

  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    font-family:'Inter',system-ui,sans-serif;
    background:var(--bg);
    color:var(--ink);
    -webkit-font-smoothing:antialiased;
  }
  .num{font-family:'Space Grotesk',sans-serif;}

  #app{ height:100vh; display:flex; flex-direction:column; }

  /* ---------- TOP BAR ---------- */
  .topbar{
    display:flex; align-items:center; justify-content:space-between;
    padding:14px 22px; background:var(--panel); border-bottom:1px solid var(--line);
    flex-shrink:0; gap:20px; z-index:20;
  }
  .brand{ display:flex; align-items:center; gap:10px; }
  .brand-mark{
    width:32px; height:32px; border-radius:9px; background:var(--brand);
    display:flex; align-items:center; justify-content:center; flex-shrink:0;
  }
  .brand-mark svg{ width:18px; height:18px; }
  .brand-name{ font-weight:700; font-size:15.5px; letter-spacing:-.01em; }
  .brand-sub{ font-size:11.5px; color:var(--ink-faint); margin-top:-2px; }

  .filters{ display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
  .fgroup{ display:flex; align-items:center; gap:6px; background:var(--bg); border:1px solid var(--line); border-radius:10px; padding:3px; }
  .fgroup button{
    border:none; background:transparent; padding:7px 13px; border-radius:8px; font-size:13px;
    font-weight:500; color:var(--ink-soft); cursor:pointer; font-family:inherit; white-space:nowrap;
  }
  .fgroup button.active{ background:var(--panel); color:var(--ink); box-shadow:var(--shadow); font-weight:600; }

  select.date-select{
    border:1px solid var(--line); background:var(--panel); border-radius:10px; padding:9px 12px;
    font-size:13px; font-family:inherit; color:var(--ink); cursor:pointer;
  }
  .custom-range{ display:none; align-items:center; gap:6px; }
  .custom-range.show{ display:flex; }
  .custom-range input{
    border:1px solid var(--line); border-radius:8px; padding:7px 9px; font-size:12.5px; font-family:inherit; color:var(--ink);
  }
  .ratio-input{
    width:52px; border:1px solid var(--line); border-radius:7px; padding:6px 7px; font-size:12.5px;
    font-family:'Space Grotesk',sans-serif; color:var(--ink); text-align:center;
  }

  .updated{ font-size:12px; color:var(--ink-faint); display:flex; align-items:center; gap:6px; }
  .dot-live{ width:6px; height:6px; border-radius:50%; background:#2E8B57; }

  /* ---------- KPI STRIP ---------- */
  .kpis{
    display:flex; gap:1px; background:var(--line); border-bottom:1px solid var(--line);
    flex-shrink:0; overflow-x:auto;
  }
  .kpi{
    background:var(--panel); padding:13px 20px; min-width:128px; flex:1;
  }
  .kpi-label{ font-size:11.5px; color:var(--ink-faint); font-weight:500; margin-bottom:5px; }
  .kpi-value{ font-size:21px; font-weight:600; letter-spacing:-.01em; }
  .kpi-value.brand{ color:var(--brand); }
  .kpi-sub{ font-size:11px; color:var(--ink-faint); margin-top:2px; }

  /* ---------- MAIN ---------- */
  .main{ flex:1; display:flex; position:relative; min-height:0; }
  .map-wrap{ flex:1; position:relative; min-width:0; }
  #map{ position:absolute; inset:0; background:#EAF0F3; }

  .leaflet-container{ font-family:'Inter',sans-serif; }

  /* pins */
  .lp-pin{
    display:flex; align-items:center; justify-content:center;
    border-radius:50%; color:#fff; font-family:'Space Grotesk',sans-serif; font-weight:700;
    box-shadow:0 2px 6px rgba(0,0,0,.25), 0 0 0 2px rgba(255,255,255,.9);
    cursor:pointer;
  }
  .lp-cluster{
    background:var(--brand); color:#fff; border-radius:50%; display:flex; align-items:center; justify-content:center;
    font-family:'Space Grotesk',sans-serif; font-weight:700; box-shadow:0 2px 8px rgba(27,75,102,.4), 0 0 0 3px rgba(255,255,255,.85);
  }

  /* floating legend */
  .legend{
    position:absolute; left:16px; bottom:20px; background:var(--panel); border:1px solid var(--line);
    border-radius:var(--radius-card); padding:12px 14px; box-shadow:var(--shadow); z-index:1000; font-size:12px;
  }
  .legend-title{ font-weight:600; margin-bottom:8px; color:var(--ink); }
  .legend-row{ display:flex; align-items:center; gap:8px; margin-bottom:4px; color:var(--ink-soft); }
  .legend-row:last-child{margin-bottom:0;}
  .legend-swatch{ width:10px; height:10px; border-radius:50%; flex-shrink:0; }

  /* floating leaderboard toggle */
  .leader-toggle{
    position:absolute; right:16px; top:16px; z-index:1000;
    background:var(--panel); border:1px solid var(--line); border-radius:var(--radius-pill);
    padding:9px 16px; font-size:13px; font-weight:600; color:var(--ink); box-shadow:var(--shadow);
    cursor:pointer; display:flex; align-items:center; gap:7px;
  }
  .leader-toggle:hover{ background:var(--brand-soft); }

  .leaderboard{
    position:absolute; right:16px; top:60px; width:280px; z-index:1000;
    background:var(--panel); border:1px solid var(--line); border-radius:var(--radius-card);
    box-shadow:var(--shadow); padding:14px; display:none; max-height:calc(100% - 90px); overflow:auto;
  }
  .leaderboard.show{ display:block; }
  .lb-tabs{ display:flex; gap:4px; background:var(--bg); border-radius:9px; padding:3px; margin-bottom:10px; }
  .lb-tabs button{
    flex:1; border:none; background:transparent; padding:6px 0; border-radius:7px; font-size:12px; font-weight:500;
    color:var(--ink-soft); cursor:pointer; font-family:inherit;
  }
  .lb-tabs button.active{ background:var(--panel); color:var(--ink); font-weight:600; box-shadow:var(--shadow); }
  .lb-row{
    display:flex; align-items:center; justify-content:space-between; padding:8px 4px; border-bottom:1px solid var(--line);
    cursor:pointer; font-size:12.5px;
  }
  .lb-row:last-child{ border-bottom:none; }
  .lb-row:hover{ background:var(--bg); border-radius:6px; }
  .lb-name{ display:flex; align-items:center; gap:8px; min-width:0; }
  .lb-rank{ color:var(--ink-faint); font-size:11px; width:14px; flex-shrink:0; }
  .lb-title{ overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-weight:500; }
  .lb-val{ font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:12.5px; flex-shrink:0; margin-left:8px; }

  /* ---------- SIDE DETAIL PANEL ---------- */
  .detail{
    width:0; flex-shrink:0; background:var(--panel); overflow:hidden;
    transition:width .22s ease; display:flex; flex-direction:column;
  }
  .detail.open{ width:360px; border-left:1px solid var(--line); overflow:hidden; }
  .detail-head{ padding:16px 18px; border-bottom:1px solid var(--line); position:relative; }
  .detail-close{
    position:absolute; right:14px; top:14px; width:30px; height:30px; border-radius:50%; border:1px solid var(--line);
    background:var(--panel); color:var(--ink-soft); cursor:pointer; display:flex; align-items:center; justify-content:center;
    font-size:15px; box-shadow:var(--shadow);
  }
  .detail-close:hover{ background:var(--line); }
  .detail-type{
    display:inline-block; font-size:10.5px; font-weight:600; padding:2px 8px; border-radius:var(--radius-pill);
    margin-bottom:7px;
  }
  .type-vended{ background:#E7EEF2; color:var(--brand); }
  .type-opl{ background:#F3EAE0; color:#8A5A2B; }
  .detail-name{ font-size:16px; font-weight:700; letter-spacing:-.01em; margin-bottom:2px; }
  .detail-loc{ font-size:12px; color:var(--ink-soft); }

  .detail-body{ padding:14px 18px; flex:1; }
  .metric-grid{ display:grid; grid-template-columns:1fr 1fr; gap:6px; margin-bottom:12px; }
  .metric-box{ background:var(--bg); border-radius:9px; padding:7px 10px; }
  .metric-box.wide{ grid-column:1 / -1; background:var(--brand); color:#fff; }
  .metric-box .l{ font-size:10px; color:var(--ink-faint); margin-bottom:2px; }
  .metric-box.wide .l{ color:rgba(255,255,255,.75); }
  .metric-box .v{ font-size:14px; font-weight:700; font-family:'Space Grotesk',sans-serif; }
  .metric-box.wide .v{ font-size:18px; }

  .section-label{ font-size:11px; font-weight:600; color:var(--ink-soft); margin:0 0 6px; text-transform:none; }
  .chart-wrap{ background:var(--bg); border-radius:9px; padding:6px 10px 0; margin-bottom:10px; }
  .chart-wrap canvas{ max-height:72px; }

  .info-grid{ display:grid; grid-template-columns:1fr 1fr; gap:6px 14px; margin-bottom:10px; }
  .info-item .k{ font-size:10px; color:var(--ink-faint); margin-bottom:1px; }
  .info-item .v{ font-size:12px; font-weight:500; line-height:1.25; }
  .info-item.full{ grid-column:1 / -1; }

  .meta-row{ display:flex; justify-content:space-between; padding:8px 0; border-bottom:1px solid var(--line); font-size:12.5px; }
  .meta-row:last-child{ border-bottom:none; }
  .meta-row .k{ color:var(--ink-faint); }
  .meta-row .v{ font-weight:500; }

  /* empty state */
  .detail-empty{
    display:flex; flex-direction:column; align-items:center; justify-content:center; height:100%;
    padding:40px 24px; text-align:center; color:var(--ink-faint); font-size:13px;
  }

  ::-webkit-scrollbar{ width:8px; height:8px; }
  ::-webkit-scrollbar-thumb{ background:#D6DAE1; border-radius:8px; }

  @media (max-width: 880px){
    .kpis{ display:none; }
    .detail{ position:absolute; right:0; top:0; bottom:0; z-index:30; box-shadow:-8px 0 24px rgba(0,0,0,.15); }
    .filters{ display:none; }
  }
</style>
</head>
<body>

<div id="app">

  <div class="topbar">
    <div class="brand">
      <div class="brand-mark">
        <svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="7" stroke="white" stroke-width="1.6"/><circle cx="12" cy="12" r="3" stroke="white" stroke-width="1.6"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2" stroke="white" stroke-width="1.6" stroke-linecap="round"/></svg>
      </div>
      <div>
        <div class="brand-name">LaundryScope</div>
        <div class="brand-sub">Utilización global de máquinas</div>
      </div>
    </div>

    <div class="filters">
      <div class="fgroup" id="type-filter">
        <button data-type="all" class="active">Todas</button>
        <button data-type="vended">Vended</button>
        <button data-type="opl">OPL</button>
      </div>
      <select class="date-select" id="date-range">
        <option value="7">Últimos 7 días</option>
        <option value="30" selected>Últimos 30 días</option>
        <option value="90">Últimos 90 días</option>
        <option value="180">Últimos 180 días</option>
        <option value="365">Últimos 365 días</option>
        <option value="custom">Rango personalizado…</option>
      </select>
      <div class="custom-range" id="custom-range">
        <input type="date" id="date-from">
        <span style="color:var(--ink-faint);font-size:12px;">→</span>
        <input type="date" id="date-to">
      </div>
      <div class="fgroup" style="padding:6px 10px; gap:8px;">
        <span style="font-size:12px; color:var(--ink-soft); font-weight:500; white-space:nowrap;">Ratio (c/d/m)</span>
        <input type="number" id="ratio-min" class="ratio-input" step="0.1" min="0" max="5" value="0">
        <span style="color:var(--ink-faint);font-size:12px;">–</span>
        <input type="number" id="ratio-max" class="ratio-input" step="0.1" min="0" max="5" value="5">
      </div>
      <div class="fgroup" style="padding:6px 10px; gap:8px;">
        <span style="font-size:12px; color:var(--ink-soft); font-weight:500; white-space:nowrap;">Máquinas</span>
        <input type="number" id="machines-min" class="ratio-input" step="1" min="0" max="40" value="0">
        <span style="color:var(--ink-faint);font-size:12px;">–</span>
        <input type="number" id="machines-max" class="ratio-input" step="1" min="0" max="40" value="40">
      </div>
    </div>

    <div class="updated"><span class="dot-live"></span> Datos agregados · última actualización hoy 04:00</div>
  </div>

  <div class="kpis" id="kpi-strip"></div>

  <div class="main">
    <div class="map-wrap">
      <div id="map"></div>
      <div class="leader-toggle" id="leader-toggle">Top / Bottom 20 <span style="color:var(--ink-faint);">▾</span></div>
      <div class="leaderboard" id="leaderboard">
        <div class="lb-tabs">
          <button class="active" data-lb="top">Top 20</button>
          <button data-lb="bottom">Bottom 20</button>
        </div>
        <div id="lb-list"></div>
      </div>
      <div class="legend">
        <div class="legend-title">Ciclos / día / máquina</div>
        <div class="legend-row"><span class="legend-swatch" style="background:var(--c1)"></span>Baja (&lt; 0.8)</div>
        <div class="legend-row"><span class="legend-swatch" style="background:var(--c2)"></span>Media-baja (0.8–1.5)</div>
        <div class="legend-row"><span class="legend-swatch" style="background:var(--c3)"></span>Media (1.5–2.5)</div>
        <div class="legend-row"><span class="legend-swatch" style="background:var(--c4)"></span>Alta (2.5–3.5)</div>
        <div class="legend-row"><span class="legend-swatch" style="background:var(--c5)"></span>Muy alta (&gt; 3.5)</div>
      </div>
    </div>

    <div class="detail" id="detail"></div>
  </div>

</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/leaflet.markercluster.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>

<script>
/* ===================== DATA GENERATION ===================== */
function seededRandom(seed){ let s = seed; return function(){ s = (s*9301+49297)%233280; return s/233280; }; }
const rnd = seededRandom(42);

/* ===================== REAL API DATA (GET /v1/laundries) ===================== */
/* Campos reales de la API + totalCyclesInPeriod/avgCyclesPerDayPerMachine del último snapshot
   sincronizado del conector MCP (periodo 2025-09-16 → 2026-09-15). Sincronización: 2026-09-16T14:23:56 */
const REAL_LAUNDRIES = [
  { id:103, name:"La Calandra", organizationName:"La Calandra", city:"Vic", country:"ES", latitude:41.9382356, longitude:2.2485013000000436, address:"Carrer Sot dels Pradals, 9", numMachines:19, laundryTypeId:1, totalCyclesInPeriod:96357, avgCyclesPerDayPerMachine:13.894304253785148 },
  { id:251, name:"Lavauto Center", organizationName:"Lavauto", city:"Vic", country:"ES", latitude:41.946795, longitude:2.258564, address:"Carretera de Manlleu, Km. 1", numMachines:6, laundryTypeId:2, totalCyclesInPeriod:601, avgCyclesPerDayPerMachine:0.27442922374429224 },
  { id:301, name:"Lavauto Norte", organizationName:"Lavauto", city:"Vic", country:"ES", latitude:41.94567576464164, longitude:2.2600350522280905, address:"Calle de Marie Curie, 1", numMachines:6, laundryTypeId:2, totalCyclesInPeriod:13568, avgCyclesPerDayPerMachine:6.195433789954338 },
  { id:302, name:"Lavauto Sur", organizationName:"Lavauto", city:"Vic", country:"ES", latitude:41.91814007520262, longitude:2.2513792485613067, address:"Calle Torre d'en Franch, 1", numMachines:8, laundryTypeId:2, totalCyclesInPeriod:17528, avgCyclesPerDayPerMachine:6.002739726027397 },
  { id:303, name:"Lavapro", organizationName:"Lavapro", city:"Barcelona", country:"ES", latitude:41.386969755177624, longitude:2.16855525970459, address:"Plaça de Catalunya, 7", numMachines:14, laundryTypeId:1, totalCyclesInPeriod:37980, avgCyclesPerDayPerMachine:7.432485322896282 },
  { id:338, name:"GEX Vended", organizationName:"GEX Vended", city:"VIC", country:"ES", latitude:41.9454746, longitude:2.2581155, address:"CARRETERA MANLLEU KM 1", numMachines:5, laundryTypeId:2, totalCyclesInPeriod:149, avgCyclesPerDayPerMachine:0.08164383561643836 },
];
const COUNTRY_NAMES = { ES:"España" };

function syntheticShapeFor(machines){
  /* Genera una FORMA diaria plausible (estacionalidad de fin de semana + ruido);
     se reescala después para que la suma anual case con el total real de la API. */
  const weekendFactor = 1.18;
  const shape = [];
  for(let d=0; d<365; d++){
    const weekday = d % 7;
    const wf = (weekday===5||weekday===6) ? weekendFactor : 1.0;
    const noise = 0.75 + rnd()*0.5;
    shape.push(Math.max(0.001, wf * noise));
  }
  return shape;
}

const ACCESS_MODES = ["Kiosko","App","Kiosko + App","Ninguno"];
const ACCESS_WEIGHTS = [0.32,0.22,0.33,0.13];
function pick(arr,w){
  if(!w) return arr[Math.floor(rnd()*arr.length)];
  let r = rnd(), acc=0;
  for(let i=0;i<arr.length;i++){ acc+=w[i]; if(r<=acc) return arr[i]; }
  return arr[arr.length-1];
}

function buildRealLaundries(){
  return REAL_LAUNDRIES.map(r => {
    /* Spec OpenAPI de Girbau: laundryTypeId 1 = OPL, 2 = Vended. */
    const type = r.laundryTypeId===1 ? "opl" : "vended";
    const washerRatio = 0.42 + rnd()*0.2;
    const washers = Math.max(1, Math.round(r.numMachines*washerRatio));
    const dryers = Math.max(1, r.numMachines - washers);

    // Forma diaria estimada, reescalada para que sume exactamente el total real anual.
    const shape = syntheticShapeFor(r.numMachines);
    const shapeSum = shape.reduce((a,b)=>a+b,0);
    const scale = r.totalCyclesInPeriod / shapeSum;
    const daily = shape.map(v => v*scale);

    return {
      id: `real-${r.id}`,
      name: r.name,
      city: r.city, country: COUNTRY_NAMES[r.country] || r.country,
      lat: r.latitude, lng: r.longitude,
      type, machines: r.numMachines,
      isReal: true, organizationName: r.organizationName, address: r.address,
      washers, dryers, daily,
      accessMode: pick(ACCESS_MODES, ACCESS_WEIGHTS),
      lastUpdate: "hoy · 09:19 (última sincronización real)"
    };
  });
}

const LAUNDRIES = buildRealLaundries();
const LAUNDRIES_BY_ID = Object.fromEntries(LAUNDRIES.map(l => [l.id, l]));

/* ===================== METRIC HELPERS ===================== */
function metricsFor(l, days){
  const slice = l.daily.slice(365-days, 365);
  const totalCycles = slice.reduce((a,b)=>a+b,0);
  const avgPerDay = totalCycles/days;
  const avgPerDayPerMachine = avgPerDay/l.machines;
  return { totalCycles: Math.round(totalCycles), avgPerDay, avgPerDayPerMachine, slice };
}
function colorFor(v){
  if(v < 0.8) return getCss('--c1');
  if(v < 1.5) return getCss('--c2');
  if(v < 2.5) return getCss('--c3');
  if(v < 3.5) return getCss('--c4');
  return getCss('--c5');
}
function getCss(v){ return getComputedStyle(document.documentElement).getPropertyValue(v).trim(); }
function fmt(n){ return Math.round(n).toLocaleString('es-ES'); }
function fmt1(n){ return n.toLocaleString('es-ES',{minimumFractionDigits:1,maximumFractionDigits:1}); }

/* ===================== STATE ===================== */
let state = { type:'all', days:365, minRatio:0, maxRatio:8, minMachines:0, maxMachines:20 };

/* ===================== MAP SETUP ===================== */
const map = L.map('map', { zoomControl:false, minZoom:2, maxBounds:[[-90,-200],[90,200]] }).setView([41.74, 2.21], 9.8);
L.control.zoom({ position:'bottomright' }).addTo(map);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  attribution:'&copy; OpenStreetMap contributors', maxZoom:18, subdomains:['a','b','c']
}).addTo(map);
map.getContainer().style.background = '#EAF0F3';

let pinLayer;
let markerIndex = {};

function pinSize(machines){ return machines > 20 ? 26 : machines > 10 ? 22 : 18; }

function buildMarker(l, m){
  const size = pinSize(l.machines);
  const color = colorFor(m.avgPerDayPerMachine);
  const icon = L.divIcon({
    className:'',
    html:`<div class="lp-pin" style="width:${size}px;height:${size}px;background:${color};font-size:${size>22?10:8.5}px;">${fmt1(m.avgPerDayPerMachine)}</div>`,
    iconSize:[size,size], iconAnchor:[size/2,size/2]
  });
  const marker = L.marker([l.lat,l.lng], { icon });
  marker.on('click', ()=> openDetail(l.id));
  markerIndex[l.id] = marker;
  return marker;
}

function renderMap(){
  if(pinLayer) map.removeLayer(pinLayer);
  pinLayer = L.layerGroup();
  markerIndex = {};
  const filtered = getFiltered();
  filtered.forEach(l=>{
    const m = metricsFor(l, state.days);
    pinLayer.addLayer(buildMarker(l,m));
  });
  map.addLayer(pinLayer);
}

function getFiltered(){
  return LAUNDRIES.filter(l => {
    if(state.type!=='all' && l.type!==state.type) return false;
    if(l.machines < state.minMachines || l.machines > state.maxMachines) return false;
    const ratio = metricsFor(l, state.days).avgPerDayPerMachine;
    if(ratio < state.minRatio || ratio > state.maxRatio) return false;
    return true;
  });
}

/* ===================== KPI STRIP ===================== */
function renderKPIs(){
  const filtered = getFiltered();
  const all = filtered.map(l => ({l, m: metricsFor(l, state.days)}));
  const totalMachines = filtered.reduce((a,x)=>a+x.machines,0);
  const totalCycles = all.reduce((a,x)=>a+x.m.totalCycles,0);
  const globalAvg = totalMachines ? totalCycles / (state.days * totalMachines) : 0;
  const vended = filtered.filter(l=>l.type==='vended').length;
  const opl = filtered.filter(l=>l.type==='opl').length;
  const countries = new Set(filtered.map(l=>l.country)).size;

  const kpis = [
    { label:'Lavanderías', value: fmt(filtered.length) },
    { label:'Países', value: fmt(countries) },
    { label:'Vended', value: fmt(vended) },
    { label:'OPL', value: fmt(opl) },
    { label:'Máquinas instaladas', value: fmt(totalMachines) },
    { label:'Ciclos en el período', value: fmt(totalCycles) },
    { label:'Promedio global', value: fmt1(globalAvg), sub:'ciclos/día/máquina', brand:true },
  ];
  document.getElementById('kpi-strip').innerHTML = kpis.map(k => `
    <div class="kpi">
      <div class="kpi-label">${k.label}</div>
      <div class="kpi-value num ${k.brand?'brand':''}">${k.value}</div>
      ${k.sub?`<div class="kpi-sub">${k.sub}</div>`:''}
    </div>
  `).join('');
}

/* ===================== LEADERBOARD ===================== */
function renderLeaderboard(kind){
  const filtered = getFiltered().map(l=>({l, m: metricsFor(l, state.days)}));
  filtered.sort((a,b)=> kind==='top' ? b.m.avgPerDayPerMachine - a.m.avgPerDayPerMachine : a.m.avgPerDayPerMachine - b.m.avgPerDayPerMachine);
  const top = filtered.slice(0,20);
  document.getElementById('lb-list').innerHTML = top.map((x,i)=>`
    <div class="lb-row" data-id="${x.l.id}">
      <div class="lb-name">
        <span class="lb-rank">${i+1}</span>
        <span class="lb-title">${x.l.name}</span>
      </div>
      <span class="lb-val" style="color:${colorFor(x.m.avgPerDayPerMachine)}">${fmt1(x.m.avgPerDayPerMachine)}</span>
    </div>
  `).join('');
  document.querySelectorAll('.lb-row').forEach(row=>{
    row.addEventListener('click', ()=>{
      const id = row.dataset.id;
      const l = LAUNDRIES_BY_ID[id];
      map.setView([l.lat,l.lng], 13, {animate:true});
      openDetail(id);
    });
  });
}

/* ===================== DETAIL PANEL ===================== */
let chartInstance = null;
let activeId = null;

function openDetail(id){
  activeId = id;
  const l = LAUNDRIES_BY_ID[id];
  const m = metricsFor(l, state.days);
  const panel = document.getElementById('detail');
  panel.classList.add('open');

  panel.innerHTML = `
    <div class="detail-head">
      <button class="detail-close" id="close-detail">✕</button>
      <span class="detail-type ${l.type==='vended'?'type-vended':'type-opl'}">${l.type==='vended'?'Vended':'OPL'}</span>
      ${l.isReal ? '<span class="detail-type" style="background:#E4F5E9;color:#1E7A43;margin-left:5px;">● Datos API</span>' : ''}
      <div class="detail-name">${l.name}</div>
      <div class="detail-loc">${l.city}, ${l.country}${l.address?` · ${l.address}`:''}</div>
    </div>
    <div class="detail-body">
      <div class="metric-grid">
        <div class="metric-box wide">
          <div class="l">Ciclos / día / máquina</div>
          <div class="v num">${fmt1(m.avgPerDayPerMachine)}</div>
        </div>
        <div class="metric-box"><div class="l">Lavadoras</div><div class="v num">${l.washers}</div></div>
        <div class="metric-box"><div class="l">Secadoras</div><div class="v num">${l.dryers}</div></div>
        <div class="metric-box"><div class="l">Ciclos totales</div><div class="v num">${fmt(m.totalCycles)}</div></div>
        <div class="metric-box"><div class="l">Ciclos / día</div><div class="v num">${fmt1(m.avgPerDay)}</div></div>
      </div>

      <div class="section-label">Evolución temporal (estimada a partir del total real)</div>
      <div class="chart-wrap"><canvas id="detail-chart"></canvas></div>

      <div class="section-label">Instalación</div>
      <div class="info-grid">
        <div class="info-item"><div class="k">País</div><div class="v">${l.country}</div></div>
        <div class="info-item"><div class="k">Ciudad</div><div class="v">${l.city}</div></div>
        <div class="info-item"><div class="k">Tipo</div><div class="v">${l.type==='vended'?'Vended':'OPL'}</div></div>
        <div class="info-item"><div class="k">Acceso</div><div class="v">${l.accessMode}</div></div>
        <div class="info-item full"><div class="k">Última actualización</div><div class="v">${l.lastUpdate}</div></div>
      </div>

      <div class="section-label">Organización</div>
      <div class="info-grid">
        <div class="info-item full"><div class="k">Nombre</div><div class="v">${l.organizationName}</div></div>
      </div>
    </div>
  `;

  document.getElementById('close-detail').addEventListener('click', closeDetail);

  const ctx = document.getElementById('detail-chart');
  if(chartInstance) chartInstance.destroy();
  const step = Math.max(1, Math.floor(m.slice.length/40));
  const sampled = m.slice.filter((_,i)=> i%step===0);
  chartInstance = new Chart(ctx, {
    type:'line',
    data:{
      labels: sampled.map((_,i)=>i),
      datasets:[{
        data: sampled.map(v=> v/l.machines),
        borderColor: '#1B4B66',
        backgroundColor:'rgba(27,75,102,.08)',
        borderWidth:2, pointRadius:0, fill:true, tension:0.35
      }]
    },
    options:{
      responsive:true,
      plugins:{ legend:{display:false}, tooltip:{ displayColors:false, callbacks:{ title:()=>'',label:(c)=>`${c.parsed.y.toFixed(2)} ciclos/día/máquina` } } },
      scales:{
        x:{ display:false },
        y:{ grid:{color:'#E4E7EC'}, ticks:{ font:{size:10}, color:'#8A93A3' }, beginAtZero:true }
      }
    }
  });
}

function closeDetail(){
  document.getElementById('detail').classList.remove('open');
  document.getElementById('detail').innerHTML = '';
  activeId = null;
}

/* ===================== FILTER WIRING ===================== */
document.querySelectorAll('#type-filter button').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    document.querySelectorAll('#type-filter button').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    state.type = btn.dataset.type;
    refreshAll();
  });
});

const dateSelect = document.getElementById('date-range');
const customRange = document.getElementById('custom-range');
dateSelect.value = "365";
dateSelect.addEventListener('change', ()=>{
  if(dateSelect.value==='custom'){
    customRange.classList.add('show');
    const to = new Date();
    const from = new Date(); from.setDate(to.getDate()-30);
    document.getElementById('date-to').value = to.toISOString().slice(0,10);
    document.getElementById('date-from').value = from.toISOString().slice(0,10);
    const min = new Date(); min.setFullYear(to.getFullYear()-1);
    document.getElementById('date-from').min = min.toISOString().slice(0,10);
    document.getElementById('date-to').min = min.toISOString().slice(0,10);
    applyCustomRange();
  } else {
    customRange.classList.remove('show');
    state.days = parseInt(dateSelect.value);
    refreshAll();
  }
});
function applyCustomRange(){
  const from = new Date(document.getElementById('date-from').value);
  const to = new Date(document.getElementById('date-to').value);
  let days = Math.round((to-from)/86400000);
  if(isNaN(days) || days<1) days = 30;
  if(days>365) days = 365;
  state.days = days;
  refreshAll();
}
document.getElementById('date-from').addEventListener('change', applyCustomRange);
document.getElementById('date-to').addEventListener('change', applyCustomRange);

const ratioMin = document.getElementById('ratio-min');
const ratioMax = document.getElementById('ratio-max');
ratioMin.max = "8"; ratioMax.max = "8"; ratioMax.value = "8";
function applyRatioFilter(){
  let mn = parseFloat(ratioMin.value); if(isNaN(mn)) mn = 0;
  let mx = parseFloat(ratioMax.value); if(isNaN(mx)) mx = 8;
  if(mn > mx){ const t=mn; mn=mx; mx=t; }
  state.minRatio = mn; state.maxRatio = mx;
  refreshAll();
}
ratioMin.addEventListener('change', applyRatioFilter);
ratioMax.addEventListener('change', applyRatioFilter);

const machinesMin = document.getElementById('machines-min');
const machinesMax = document.getElementById('machines-max');
machinesMax.value = "20";
function applyMachinesFilter(){
  let mn = parseInt(machinesMin.value); if(isNaN(mn)) mn = 0;
  let mx = parseInt(machinesMax.value); if(isNaN(mx)) mx = 20;
  if(mn > mx){ const t=mn; mn=mx; mx=t; }
  state.minMachines = mn; state.maxMachines = mx;
  refreshAll();
}
machinesMin.addEventListener('change', applyMachinesFilter);
machinesMax.addEventListener('change', applyMachinesFilter);

/* leaderboard toggle */
const leaderToggle = document.getElementById('leader-toggle');
const leaderboard = document.getElementById('leaderboard');
leaderToggle.addEventListener('click', ()=>{
  leaderboard.classList.toggle('show');
  if(leaderboard.classList.contains('show')) renderLeaderboard(currentLbTab);
});
let currentLbTab = 'top';
document.querySelectorAll('.lb-tabs button').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    document.querySelectorAll('.lb-tabs button').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    currentLbTab = btn.dataset.lb;
    renderLeaderboard(currentLbTab);
  });
});

/* ===================== REFRESH ===================== */
function refreshAll(){
  renderKPIs();
  renderMap();
  if(leaderboard.classList.contains('show')) renderLeaderboard(currentLbTab);
  if(activeId !== null) openDetail(activeId);
}

refreshAll();
</script>
</body>
</html>
