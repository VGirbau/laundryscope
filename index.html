<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LaundryScope — Panel de utilización</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/MarkerCluster.css" />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/MarkerCluster.Default.css" />

<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap');

  :root{
    --bg: #F5F6F8;
    --panel: #FFFFFF;
    --line: #E4E7EC;
    --ink: #171B21;
    --ink-soft: #5B6472;
    --ink-faint: #8A93A3;
    --brand: #1B4B66;
    --brand-soft: #E7EEF2;
    --accent: #2FB8C6;

    --c1: #E5484D;
    --c2: #F0883E;
    --c3: #F2C94C;
    --c4: #8BC77A;
    --c5: #2E8B57;

    --radius-card: 14px;
    --radius-pill: 999px;
    --shadow: 0 1px 2px rgba(23,27,33,.04), 0 8px 24px -12px rgba(23,27,33,.12);
  }

  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    font-family:'Inter',system-ui,sans-serif;
    background:var(--bg);
    color:var(--ink);
    -webkit-font-smoothing:antialiased;
  }
  .num{font-family:'Space Grotesk',sans-serif;}

  #app{ height:100vh; display:flex; flex-direction:column; }

  .topbar{
    display:flex; align-items:center; justify-content:space-between;
    padding:14px 22px; background:var(--panel); border-bottom:1px solid var(--line);
    flex-shrink:0; gap:20px; z-index:20;
  }
  .brand{ display:flex; align-items:center; gap:10px; }
  .brand-mark{
    width:32px; height:32px; border-radius:9px; background:var(--brand);
    display:flex; align-items:center; justify-content:center; flex-shrink:0;
  }
  .brand-mark svg{ width:18px; height:18px; }
  .brand-name{ font-weight:700; font-size:15.5px; letter-spacing:-.01em; }
  .brand-sub{ font-size:11.5px; color:var(--ink-faint); margin-top:-2px; }

  .filters{ display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
  .fgroup{ display:flex; align-items:center; gap:6px; background:var(--bg); border:1px solid var(--line); border-radius:10px; padding:3px; }
  .fgroup button{
    border:none; background:transparent; padding:7px 13px; border-radius:8px; font-size:13px;
    font-weight:500; color:var(--ink-soft); cursor:pointer; font-family:inherit; white-space:nowrap;
  }
  .fgroup button.active{ background:var(--panel); color:var(--ink); box-shadow:var(--shadow); font-weight:600; }

  select.date-select{
    border:1px solid var(--line); background:var(--panel); border-radius:10px; padding:9px 12px;
    font-size:13px; font-family:inherit; color:var(--ink); cursor:pointer;
  }
  .custom-range{ display:none; align-items:center; gap:6px; }
  .custom-range.show{ display:flex; }
  .custom-range input{
    border:1px solid var(--line); border-radius:8px; padding:7px 9px; font-size:12.5px; font-family:inherit; color:var(--ink);
  }
  .ratio-input{
    width:52px; border:1px solid var(--line); border-radius:7px; padding:6px 7px; font-size:12.5px;
    font-family:'Space Grotesk',sans-serif; color:var(--ink); text-align:center;
  }

  .updated{ font-size:12px; color:var(--ink-faint); display:flex; align-items:center; gap:6px; }
  .dot-live{ width:6px; height:6px; border-radius:50%; background:#2E8B57; }

  .kpis{
    display:flex; gap:1px; background:var(--line); border-bottom:1px solid var(--line);
    flex-shrink:0; overflow-x:auto;
  }
  .kpi{
    background:var(--panel); padding:13px 20px; min-width:128px; flex:1;
  }
  .kpi-label{ font-size:11.5px; color:var(--ink-faint); font-weight:500; margin-bottom:5px; }
  .kpi-value{ font-size:21px; font-weight:600; letter-spacing:-.01em; }
  .kpi-value.brand{ color:var(--brand); }
  .kpi-sub{ font-size:11px; color:var(--ink-faint); margin-top:2px; }

  .main{ flex:1; display:flex; position:relative; min-height:0; }
  .map-wrap{ flex:1; position:relative; min-width:0; }
  #map{ position:absolute; inset:0; background:#EAF0F3; }

  .leaflet-container{ font-family:'Inter',sans-serif; }

  .lp-pin{
    display:flex; align-items:center; justify-content:center;
    border-radius:50%; color:#fff; font-family:'Space Grotesk',sans-serif; font-weight:700;
    box-shadow:0 2px 6px rgba(0,0,0,.25), 0 0 0 2px rgba(255,255,255,.9);
    cursor:pointer;
  }

  .legend{
    position:absolute; left:16px; bottom:20px; background:var(--panel); border:1px solid var(--line);
    border-radius:var(--radius-card); padding:12px 14px; box-shadow:var(--shadow); z-index:1000; font-size:12px;
  }
  .legend-title{ font-weight:600; margin-bottom:8px; color:var(--ink); }
  .legend-row{ display:flex; align-items:center; gap:8px; margin-bottom:4px; color:var(--ink-soft); }
  .legend-row:last-child{margin-bottom:0;}
  .legend-swatch{ width:10px; height:10px; border-radius:50%; flex-shrink:0; }

  .leader-toggle{
    position:absolute; right:16px; top:16px; z-index:1000;
    background:var(--panel); border:1px solid var(--line); border-radius:var(--radius-pill);
    padding:9px 16px; font-size:13px; font-weight:600; color:var(--ink); box-shadow:var(--shadow);
    cursor:pointer; display:flex; align-items:center; gap:7px;
  }
  .leader-toggle:hover{ background:var(--brand-soft); }

  .leaderboard{
    position:absolute; right:16px; top:60px; width:280px; z-index:1000;
    background:var(--panel); border:1px solid var(--line); border-radius:var(--radius-card);
    box-shadow:var(--shadow); padding:14px; display:none; max-height:calc(100% - 90px); overflow:auto;
  }
  .leaderboard.show{ display:block; }
  .lb-tabs{ display:flex; gap:4px; background:var(--bg); border-radius:9px; padding:3px; margin-bottom:10px; }
  .lb-tabs button{
    flex:1; border:none; background:transparent; padding:6px 0; border-radius:7px; font-size:12px; font-weight:500;
    color:var(--ink-soft); cursor:pointer; font-family:inherit;
  }
  .lb-tabs button.active{ background:var(--panel); color:var(--ink); font-weight:600; box-shadow:var(--shadow); }
  .lb-row{
    display:flex; align-items:center; justify-content:space-between; padding:8px 4px; border-bottom:1px solid var(--line);
    cursor:pointer; font-size:12.5px;
  }
  .lb-row:last-child{ border-bottom:none; }
  .lb-row:hover{ background:var(--bg); border-radius:6px; }
  .lb-name{ display:flex; align-items:center; gap:8px; min-width:0; }
  .lb-rank{ color:var(--ink-faint); font-size:11px; width:14px; flex-shrink:0; }
  .lb-title{ overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-weight:500; }
  .lb-val{ font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:12.5px; flex-shrink:0; margin-left:8px; }

  .detail{
    width:0; flex-shrink:0; background:var(--panel); overflow:hidden;
    transition:width .22s ease; display:flex; flex-direction:column;
  }
  .detail.open{ width:360px; border-left:1px solid var(--line); overflow:auto; }
  .detail-head{ padding:16px 18px; border-bottom:1px solid var(--line); position:sticky; top:0; background:var(--panel); }
  .detail-close{
    position:absolute; right:14px; top:14px; width:30px; height:30px; border-radius:50%; border:1px solid var(--line);
    background:var(--panel); color:var(--ink-soft); cursor:pointer; display:flex; align-items:center; justify-content:center;
    font-size:15px; box-shadow:var(--shadow);
  }
  .detail-close:hover{ background:var(--line); }
  .detail-type{
    display:inline-block; font-size:10.5px; font-weight:600; padding:2px 8px; border-radius:var(--radius-pill);
    margin-bottom:7px;
  }
  .type-vended{ background:#E7EEF2; color:var(--brand); }
  .type-opl{ background:#F3EAE0; color:#8A5A2B; }
  .detail-name{ font-size:16px; font-weight:700; letter-spacing:-.01em; margin-bottom:2px; }
  .detail-loc{ font-size:12px; color:var(--ink-soft); }

  .detail-body{ padding:14px 18px; }
  .metric-grid{ display:grid; grid-template-columns:1fr 1fr; gap:6px; margin-bottom:12px; }
  .metric-box{ background:var(--bg); border-radius:9px; padding:7px 10px; }
  .metric-box.wide{ grid-column:1 / -1; background:var(--brand); color:#fff; }
  .metric-box .l{ font-size:10px; color:var(--ink-faint); margin-bottom:2px; }
  .metric-box.wide .l{ color:rgba(255,255,255,.75); }
  .metric-box .v{ font-size:14px; font-weight:700; font-family:'Space Grotesk',sans-serif; }
  .metric-box.wide .v{ font-size:18px; }

  .section-label{ font-size:11px; font-weight:600; color:var(--ink-soft); margin:0 0 6px; text-transform:none; }
  .chart-wrap{ background:var(--bg); border-radius:9px; padding:6px 10px 0; margin-bottom:10px; }
  .chart-wrap canvas{ max-height:72px; }

  .info-grid{ display:grid; grid-template-columns:1fr 1fr; gap:6px 14px; margin-bottom:10px; }
  .info-item .k{ font-size:10px; color:var(--ink-faint); margin-bottom:1px; }
  .info-item .v{ font-size:12px; font-weight:500; line-height:1.25; }
  .info-item.full{ grid-column:1 / -1; }

  .meta-row{ display:flex; justify-content:space-between; padding:8px 0; border-bottom:1px solid var(--line); font-size:12.5px; }
  .meta-row:last-child{ border-bottom:none; }
  .meta-row .k{ color:var(--ink-faint); }
  .meta-row .v{ font-weight:500; }

  .detail-empty{
    display:flex; flex-direction:column; align-items:center; justify-content:center; height:100%;
    padding:40px 24px; text-align:center; color:var(--ink-faint); font-size:13px;
  }

  ::-webkit-scrollbar{ width:8px; height:8px; }
  ::-webkit-scrollbar-thumb{ background:#D6DAE1; border-radius:8px; }

  @media (max-width: 880px){
    .kpis{ display:none; }
    .detail{ position:absolute; right:0; top:0; bottom:0; z-index:30; box-shadow:-8px 0 24px rgba(0,0,0,.15); }
    .filters{ display:none; }
  }
</style>
</head>

      <div class="custom-range" id="custom-range">

      <div class="fgroup" style="padding:6px 10px; gap:8px;">
        <span style="font-size:12px; color:var(--ink-soft); font-weight:500; white-space:nowrap;">Ratio (c/d)</span>
        <input type="number" id="ratio-min" class="ratio-input" step="0.1" min="0" value="0">
        <span style="color:var(--ink-faint);font-size:12px;">–</span>
        <input type="number" id="ratio-max" class="ratio-input" step="0.1" min="0" value="5">
      </div>
      <div class="fgroup" style="padding:6px 10px; gap:8px;">
        <span style="font-size:12px; color:var(--ink-soft); font-weight:500; white-space:nowrap;">Máquinas</span>
        <input type="number" id="machines-min" class="ratio-input" step="1" min="0" value="0">
        <span style="color:var(--ink-faint);font-size:12px;">–</span>
        <input type="number" id="machines-max" class="ratio-input" step="1" min="0" value="20">
      </div>
    </div>

    <div class="updated"><span class="dot-live"></span> 42 lavanderías · última sincronización 2026-09-17 05:42</div>
  </div>

  <div class="kpis" id="kpi-strip"></div>

  <div class="main">
    <div class="map-wrap">
      <div id="map"></div>
      <div class="leader-toggle" id="leader-toggle">Top / Bottom 20 <span style="color:var(--ink-faint);">▾</span></div>
      <div class="leaderboard" id="leaderboard">
        <div class="lb-tabs">
          <button class="active" data-lb="top">Top 20</button>
          <button data-lb="bottom">Bottom 20</button>
        </div>
        <div id="lb-list"></div>
      </div>
      <div class="legend" id="legend">
        <div class="legend-title">Ciclos / día / máquina</div>
        <div class="legend-row"><span class="legend-swatch" style="background:var(--c1)"></span>Baja (&lt; 0.8)</div>
        <div class="legend-row"><span class="legend-swatch" style="background:var(--c2)"></span>Media-baja (0.8–1.5)</div>
        <div class="legend-row"><span class="legend-swatch" style="background:var(--c3)"></span>Media (1.5–2.5)</div>
        <div class="legend-row"><span class="legend-swatch" style="background:var(--c4)"></span>Alta (2.5–3.5)</div>

      </div>
    </div>

    <div class="detail" id="detail"></div>
  </div>

</div>

const LAUNDRIES_BY_ID = Object.fromEntries(REAL_LAUNDRIES.map(l => [l.id, l]));

function metricsFor(l, days){
  /* Usar valores REALES, no aleatorios */
  const totalCycles = Math.round(l.totalCyclesInPeriod * (days / 365));
  const avgPerDay = totalCycles / days;
  const avgPerDayPerMachine = avgPerDay / l.numMachines;
  return { totalCycles, avgPerDay, avgPerDayPerMachine, slice: [] };
}

function updateLegend(){
  const legendTitle = document.querySelector('.legend-title');
  const legendRows = document.querySelectorAll('.legend-row');
  
  if(state.metric === 'per-machine'){
    legendTitle.textContent = 'Ciclos / día / máquina';
    legendRows[0].innerHTML = '<span class="legend-swatch" style="background:var(--c1)"></span>Baja (< 0.8)';
    legendRows[1].innerHTML = '<span class="legend-swatch" style="background:var(--c2)"></span>Media-baja (0.8–1.5)';
    legendRows[2].innerHTML = '<span class="legend-swatch" style="background:var(--c3)"></span>Media (1.5–2.5)';
    legendRows[3].innerHTML = '<span class="legend-swatch" style="background:var(--c4)"></span>Alta (2.5–3.5)';
    legendRows[4].innerHTML = '<span class="legend-swatch" style="background:var(--c5)"></span>Muy alta (> 3.5)';
  } else {
    legendTitle.textContent = 'Ciclos / día / lavandería';
    legendRows[0].innerHTML = '<span class="legend-swatch" style="background:var(--c1)"></span>Baja (< 8)';
    legendRows[1].innerHTML = '<span class="legend-swatch" style="background:var(--c2)"></span>Media-baja (8–15)';
    legendRows[2].innerHTML = '<span class="legend-swatch" style="background:var(--c3)"></span>Media (15–25)';
    legendRows[3].innerHTML = '<span class="legend-swatch" style="background:var(--c4)"></span>Alta (25–35)';
    legendRows[4].innerHTML = '<span class="legend-swatch" style="background:var(--c5)"></span>Muy alta (> 35)';
  }
}

function colorFor(v){
  if(state.metric === 'per-laundry'){
    if(v < 8) return getCss('--c1');
    if(v < 15) return getCss('--c2');
    if(v < 25) return getCss('--c3');
    if(v < 35) return getCss('--c4');
    return getCss('--c5');
  } else {
    if(v < 0.8) return getCss('--c1');
    if(v < 1.5) return getCss('--c2');
    if(v < 2.5) return getCss('--c3');
    if(v < 3.5) return getCss('--c4');
    return getCss('--c5');
  }
}

function getCss(v){ return getComputedStyle(document.documentElement).getPropertyValue(v).trim(); }
function fmt(n){ return Math.round(n).toLocaleString('es-ES'); }
function fmt1(n){ return n.toLocaleString('es-ES',{minimumFractionDigits:1,maximumFractionDigits:1}); }

let state = { type:'all', days:365, metric:'per-machine', minRatio:0, maxRatio:5, minMachines:0, maxMachines:20 };

const map = L.map('map', { zoomControl:false, minZoom:2 }).setView([56.95, 24.1], 7);
L.control.zoom({ position:'bottomright' }).addTo(map);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  attribution:'&copy; OpenStreetMap contributors', maxZoom:18, subdomains:['a','b','c']
}).addTo(map);

let pinLayer, chartInstance = null, activeId = null;

function getMetricValue(l, m){
  if(state.metric === 'per-laundry'){
    return m.avgPerDay;
  }
  return m.avgPerDayPerMachine;
}

function buildMarker(l, m){
  const v = getMetricValue(l, m);
  const size = l.numMachines > 10 ? 22 : 18;
  const color = colorFor(v);
  const icon = L.divIcon({
    className:'',
    html:`<div class="lp-pin" style="width:${size}px;height:${size}px;background:${color};font-size:${size>18?10:8.5}px;">${fmt1(v)}</div>`,
    iconSize:[size,size], iconAnchor:[size/2,size/2]
  });
  const marker = L.marker([l.latitude,l.longitude], { icon });
  marker.on('click', ()=> openDetail(l.id));
  return marker;
}

function renderMap(){
  if(pinLayer) map.removeLayer(pinLayer);
  pinLayer = L.layerGroup();
  getFiltered().forEach(l=>{
    const m = metricsFor(l, state.days);
    pinLayer.addLayer(buildMarker(l,m));
  });
  map.addLayer(pinLayer);
}

function getFiltered(){
  return REAL_LAUNDRIES.filter(l => {
    if(state.type!=='all' && l.laundryTypeId !== (state.type==='vended'?2:1)) return false;
    if(l.numMachines < state.minMachines || l.numMachines > state.maxMachines) return false;
    const v = state.metric === 'per-laundry' 
      ? metricsFor(l, state.days).avgPerDay 
      : metricsFor(l, state.days).avgPerDayPerMachine;
    if(v < state.minRatio || v > state.maxRatio) return false;
    return true;
  });
}

function renderKPIs(){
  const filtered = getFiltered();
  const all = filtered.map(l => ({l, m: metricsFor(l, state.days)}));
  const totalMachines = filtered.reduce((a,x)=>a+x.numMachines,0);
  const totalCycles = all.reduce((a,x)=>a+x.m.totalCycles,0);
  const globalAvgPerMachine = totalMachines ? totalCycles / (state.days * totalMachines) : 0;
  const globalAvgPerLaundry = filtered.length ? all.reduce((a,x)=>a+x.m.avgPerDay,0) / filtered.length : 0;
  const vended = filtered.filter(l=>l.laundryTypeId===2).length;
  const opl = filtered.filter(l=>l.laundryTypeId===1).length;

  const kpis = [
    { label:'Lavanderías', value: fmt(filtered.length) },
    { label:'Vended', value: fmt(vended) },
    { label:'OPL', value: fmt(opl) },
    { label:'Máquinas instaladas', value: fmt(totalMachines) },
    { label:'Ciclos en el período', value: fmt(totalCycles) },
    { label:'Promedio global c/d/m', value: fmt1(globalAvgPerMachine), sub:'ciclos/máquina', brand:true },
    { label:'Promedio global c/d/lav', value: fmt1(globalAvgPerLaundry), sub:'ciclos/lavandería', brand:true },
  ];
  document.getElementById('kpi-strip').innerHTML = kpis.map(k => `
    <div class="kpi">
      <div class="kpi-label">${k.label}</div>
      <div class="kpi-value num ${k.brand?'brand':''}">${k.value}</div>
      ${k.sub?`<div class="kpi-sub">${k.sub}</div>`:''}
    </div>
  `).join('');
}

function renderLeaderboard(kind){
  const filtered = getFiltered().map(l=>({l, m: metricsFor(l, state.days)}));
  filtered.sort((a,b)=>{
    const aVal = getMetricValue(a.l, a.m);
    const bVal = getMetricValue(b.l, b.m);
    return kind==='top' ? bVal - aVal : aVal - bVal;
  });
  const top = filtered.slice(0,20);
  document.getElementById('lb-list').innerHTML = top.map((x,i)=>{
    const v = getMetricValue(x.l, x.m);
    return `
    <div class="lb-row" data-id="${x.l.id}">
      <div class="lb-name">
        <span class="lb-rank">${i+1}</span>
        <span class="lb-title">${x.l.name}</span>
      </div>
      <span class="lb-val" style="color:${colorFor(v)}">${fmt1(v)}</span>
    </div>
  `}).join('');
  document.querySelectorAll('.lb-row').forEach(row=>{
    row.addEventListener('click', ()=>{
      const id = row.dataset.id;
      const l = LAUNDRIES_BY_ID[id];
      map.setView([l.latitude,l.longitude], 13, {animate:true});
      openDetail(id);
    });
  });
}

function openDetail(id){
  activeId = id;
  const l = LAUNDRIES_BY_ID[id];
  const m = metricsFor(l, state.days);
  const vPerMachine = m.avgPerDayPerMachine;
  const vPerLaundry = m.avgPerDay;
  const panel = document.getElementById('detail');
  panel.classList.add('open');

  panel.innerHTML = `
    <div class="detail-head">
      <button class="detail-close" id="close-detail">✕</button>
      <span class="detail-type" style="${l.laundryTypeId===2?'background:#E7EEF2;color:#1B4B66;':'background:#F3EAE0;color:#8A5A2B;'}">${l.laundryTypeId===2?'Vended':'OPL'}</span>
      <div class="detail-name">${l.name}</div>
      <div class="detail-loc">${l.city}, ${l.country}${l.address?` · ${l.address}`:''}</div>
    </div>
    <div class="detail-body">
      <div class="metric-grid">
        <div class="metric-box wide">
          <div class="l">Ciclos / día / máquina</div>
          <div class="v num">${fmt1(vPerMachine)}</div>
        </div>
        <div class="metric-box wide" style="background:#666; grid-column:1 / -1;">
          <div class="l">Ciclos / día / lavandería</div>
          <div class="v num">${fmt1(vPerLaundry)}</div>
        </div>
        <div class="metric-box"><div class="l">Máquinas</div><div class="v num">${l.numMachines}</div></div>
        <div class="metric-box"><div class="l">Ciclos totales</div><div class="v num">${fmt(m.totalCycles)}</div></div>
      </div>

      <div class="section-label">Instalación</div>
      <div class="info-grid">
        <div class="info-item"><div class="k">País</div><div class="v">${l.country}</div></div>
        <div class="info-item"><div class="k">Ciudad</div><div class="v">${l.city}</div></div>
        <div class="info-item full"><div class="k">Organización</div><div class="v">${l.organizationName}</div></div>
      </div>
    </div>
  `;

  document.getElementById('close-detail').addEventListener('click', closeDetail);
}

function closeDetail(){
  document.getElementById('detail').classList.remove('open');
  document.getElementById('detail').innerHTML = '';
  activeId = null;
}

document.querySelectorAll('#type-filter button').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    document.querySelectorAll('#type-filter button').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    state.type = btn.dataset.type;
    refreshAll();
  });
});

document.querySelectorAll('#metric-filter button').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    /* Evitar clickeos múltiples en el mismo botón */
    if(btn.classList.contains('active')) return;
    
    document.querySelectorAll('#metric-filter button').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    state.metric = btn.dataset.metric;
    
    /* Resetear filtros al máximo rango según métrica */
    ratioMin.value = 0;
    if(state.metric === 'per-laundry'){
      ratioMax.value = 50;
      state.maxRatio = 50;
    } else {
      ratioMax.value = 5;
      state.maxRatio = 5;
    }
    state.minRatio = 0;
    
    /* Actualizar leyenda */
    updateLegend();
    refreshAll();
  });
});

const dateSelect = document.getElementById('date-range');
dateSelect.addEventListener('change', ()=>{
  state.days = parseInt(dateSelect.value);
  refreshAll();
});

const ratioMin = document.getElementById('ratio-min');
const ratioMax = document.getElementById('ratio-max');
ratioMin.addEventListener('change', ()=>{
  state.minRatio = parseFloat(ratioMin.value) || 0;
  refreshAll();
});
ratioMax.addEventListener('change', ()=>{
  state.maxRatio = parseFloat(ratioMax.value) || 5;
  refreshAll();
});

const machinesMin = document.getElementById('machines-min');
const machinesMax = document.getElementById('machines-max');
machinesMin.addEventListener('change', ()=>{
  state.minMachines = parseInt(machinesMin.value) || 0;
  refreshAll();
});
machinesMax.addEventListener('change', ()=>{
  state.maxMachines = parseInt(machinesMax.value) || 20;
  refreshAll();
});

const leaderToggle = document.getElementById('leader-toggle');
const leaderboard = document.getElementById('leaderboard');
leaderToggle.addEventListener('click', ()=>{
  leaderboard.classList.toggle('show');
  if(leaderboard.classList.contains('show')) renderLeaderboard('top');
});

document.querySelectorAll('.lb-tabs button').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    document.querySelectorAll('.lb-tabs button').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    renderLeaderboard(btn.dataset.lb);
  });
});

function refreshAll(){
  updateLegend();
  renderKPIs();
  renderMap();
  if(leaderboard.classList.contains('show')) renderLeaderboard('top');
  if(activeId !== null) openDetail(activeId);
}

refreshAll();
</script>
